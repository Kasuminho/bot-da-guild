services:
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: botguild
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d botguild"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/app
    command: python bot.py

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    env_file:
      - ./dashboard/.env
    ports:
      - "3000:3000"
    command: npm run start

volumes:
  pgdata:
